name: Build

# Builds every slice in slices.json from the upstream tag godot.env pins, with the patches and the trim, and runs the
# hardening check on the slices a runner can run (Linux, macOS). Each binary gets a build-provenance attestation. A
# release publishes the artifacts of one run of this workflow, unchanged (release.yml).

on:
  push:
    branches: [main]
  pull_request:
  # By hand: some slices (comma-separated, default all) with extra scons options, for measurements. The release
  # workflow publishes push runs only, so such a run is never released.
  workflow_dispatch:
    inputs:
      slices:
        description: Slices to build, comma-separated (empty for all)
        default: ''
      scons:
        description: Extra scons options, last on the command line
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test tests/*.test.mjs

  slices:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        env:
          SLICES: ${{ inputs.slices }}
        run: |
          python3 -c 'import json, sys; s = json.load(open("slices.json"))["slices"]; only = [x for x in sys.argv[1].split(",") if x]; print("matrix=" + json.dumps({"include": [{"slice": k, **v} for k, v in s.items() if not only or k in only]}))' "$SLICES" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, slices]
    name: ${{ matrix.slice }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.slices.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: wayland-scanner (Linux)
        if: matrix.slice == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libwayland-bin

      - name: Xcode (macOS)
        if: matrix.slice == 'macos'
        run: |
          want="$(sed -n 's/^XCODE_VERSION=\([0-9.]*\).*/\1/p' scripts/build.sh)"
          xcode="$(ls -d /Applications/Xcode_"$want".app /Applications/Xcode_"$want".0.app 2>/dev/null | head -1)"
          [ -n "$xcode" ] || { echo "no Xcode $want on this image:"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Build
        env:
          WR_GODOT_CACHE: ${{ runner.temp }}/cache
          WR_GODOT_OUT: ${{ runner.temp }}/out
          SCONS_EXTRA: ${{ inputs.scons }}
        # SCONS_EXTRA is split into options on purpose.
        run: scripts/build.sh "${{ matrix.slice }}" -- $SCONS_EXTRA

      - name: Attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/out/${{ matrix.asset }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.slice }}
          path: |
            ${{ runner.temp }}/out/${{ matrix.asset }}
            ${{ runner.temp }}/out/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 30

  check:
    needs: [slices, build]
    name: check ${{ matrix.slice }}
    runs-on: ${{ matrix.runner }}
    # Only a slice this run built: a dispatched run may build some (a job's `if` cannot read the matrix; its env can).
    env:
      BUILT: ${{ contains(fromJSON(needs.slices.outputs.matrix).include.*.slice, matrix.slice) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slice: linux, asset: godot_linux_release_wr.x86_64, runner: ubuntu-24.04 }
          - { slice: macos, asset: godot_macos_release_wr.universal, runner: macos-26 }
    steps:
      - if: env.BUILT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.BUILT == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.slice }}
          path: ${{ runner.temp }}/engine
      - name: The hardening check
        if: env.BUILT == 'true'
        run: |
          chmod +x "$RUNNER_TEMP/engine/${{ matrix.asset }}"
          check/check-hardening.sh "$RUNNER_TEMP/engine/${{ matrix.asset }}"
